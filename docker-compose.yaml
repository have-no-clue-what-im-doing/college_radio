services:
  college_stream_1:
    container_name: college-radio-1
    hostname: college-radio-1
    build: .
    environment:
      GROUP: 1
    logging:
      driver: loki
      options:
        loki-url: "http://10.10.13.17:3100/loki/api/v1/push"
        loki-batch-size: "500"
        loki-timeout: "10s"
        loki-retries: "2"
        labels: "app=collage_radio"
